name: Deploy Resume to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - 'README*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node (site build)
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Korean resume
        run: |
          cp payload/index_ko.ts payload/index.ts
          npx next build
          npx next export -o docs/ko
          touch docs/ko/.nojekyll

      - name: Setup Node (PDF)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate PDF
        run: |
          npm install puppeteer --no-save --legacy-peer-deps
          node scripts/generate-pdf.js ko

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ko

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
